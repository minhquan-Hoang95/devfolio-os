
services:
###> php ###
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./:/var/www/app # Adjust this to your project directory
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini # Optional: Custom PHP configuration
    depends_on:
      database:
          condition: service_healthy
      redis:
          condition: service_healthy

    environment:
      # Symfony environement variables
        APP_ENV: ${APP_ENV:-dev}
        DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
        REDIS_URL: redis://redis:6379

###> Nginx ###
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/app # Adjust this to your project directory
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # Nginx configuration
    depends_on:
      - php
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> redis ###
  redis:
      image: redis:alpine
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        timeout: 5s
        retries: 5
      volumes:
        - redis_data:/data

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
  redis_data:
###< doctrine/doctrine-bundle ###
